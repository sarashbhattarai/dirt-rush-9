<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, user-scalable=no"
  >

  <title>DIRT RUSH 9</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #fff;
      font: 700 15px Arial, sans-serif;
    }

    body {
      touch-action: none;
    }

    canvas {
      display: block;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at center,
          #34452a,
          #080b0a
        );
      z-index: 20;
    }

    .panel {
      width: min(560px, 92vw);
      padding: 30px;
      border: 1px solid #ffffff22;
      border-radius: 22px;
      background: #10161dcc;
      text-align: center;
      box-shadow: 0 20px 80px #000b;
      backdrop-filter: blur(8px);
    }

    .logo {
      font-size: clamp(42px, 10vw, 76px);
      font-weight: 1000;
      letter-spacing: -4px;
      line-height: 1;
    }

    .logo i {
      color: #ffb000;
      font-style: normal;
    }

    .sub {
      color: #aab3b8;
      letter-spacing: 2px;
      margin: 14px 0 25px;
    }

    .input {
      width: 100%;
      padding: 14px;
      border-radius: 11px;
      border: 1px solid #ffffff22;
      background: #080b0d;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .input:focus {
      border-color: #f4aa00;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: #f4aa00;
      color: #111;
      font-weight: 1000;
      font-size: 15px;
    }

    .btn:hover {
      background: #ffc229;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .alt {
      background: #273039;
      color: #fff;
    }

    .alt:hover {
      background: #35434d;
    }

    .hidden {
      display: none !important;
    }

    .players {
      text-align: left;
      margin: 15px 0;
      padding: 8px;
      border-radius: 12px;
      background: #080b0d;
      min-height: 50px;
    }

    .p {
      padding: 9px;
      border-bottom: 1px solid #ffffff0d;
    }

    .p:last-child {
      border-bottom: 0;
    }

    .dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      margin-right: 8px;
    }

    #msg {
      min-height: 22px;
      margin-top: 14px;
      color: #ffb4a9;
      font-weight: 700;
    }

    #share {
      margin: 10px 0;
      color: #ffc04d;
      font-size: 13px;
      word-break: break-all;
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .b {
      position: absolute;
      padding: 9px 12px;
      border-radius: 11px;
      background: #0b1014cc;
      border: 1px solid #ffffff1c;
      backdrop-filter: blur(5px);
    }

    .pos {
      left: 14px;
      top: 14px;
    }

    .lap {
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      text-align: center;
    }

    .time {
      right: 14px;
      top: 14px;
    }

    .board {
      right: 14px;
      top: 70px;
      width: 210px;
    }

    .count {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(90px, 16vw, 150px);
      font-weight: 1000;
      text-shadow: 0 8px 30px #000;
      color: #fff;
    }

    .finish {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: #0009;
    }

    .line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 5px;
    }

    .me {
      color: #ffc04d;
    }

    .controls {
      color: #fff;
      opacity: 0.8;
      line-height: 1.6;
    }

    .touch {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 8;
      display: none;
      gap: 7px;
    }

    .touch button {
      height: 62px;
      flex: 1;
      border: 1px solid #fff3;
      border-radius: 14px;
      background: #10171ddd;
      color: #fff;
      font-weight: 1000;
      font-size: 12px;
      user-select: none;
      touch-action: none;
    }

    .touch button:active {
      background: #ffffff33;
    }

    .touch .gas {
      background: #b77900dd;
    }

    .touch .brake {
      background: #9d3b35dd;
    }

    @media (pointer: coarse) {
      .touch {
        display: flex;
      }

      .board {
        width: 160px;
      }

      .controls {
        display: none;
      }
    }

    @media (max-width: 600px) {
      .panel {
        padding: 22px;
      }

      .row {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .board {
        top: 125px;
        right: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       MAIN MENU
       ===================================================== -->

  <div id="menu" class="screen">
    <div class="panel">

      <div class="logo">
        DIRT <i>RUSH</i> 9
      </div>

      <div class="sub">
        9 RIDERS. 1 TRACK. NO BRAKES.
      </div>

      <input
        id="name"
        class="input"
        maxlength="16"
        autocomplete="off"
        placeholder="Enter rider name"
      >

      <div class="row">
        <button
          id="create"
          class="btn"
          type="button"
        >
          CREATE ROOM
        </button>

        <button
          id="join"
          class="btn alt"
          type="button"
        >
          JOIN ROOM
        </button>
      </div>

      <div
        id="joinrow"
        class="row hidden"
      >
        <input
          id="code"
          class="input"
          autocomplete="off"
          placeholder="Room code"
        >

        <button
          id="go"
          class="btn"
          type="button"
        >
          JOIN
        </button>
      </div>

      <div id="msg"></div>

    </div>
  </div>


  <!-- =====================================================
       LOBBY
       ===================================================== -->

  <div id="lobby" class="screen hidden">
    <div class="panel">

      <div
        class="logo"
        style="font-size:42px"
      >
        DIRT <i>RUSH</i> 9
      </div>

      <div class="sub">
        MULTIPLAYER LOBBY
      </div>

      <div>ROOM CODE</div>

      <h2 id="room">
        --------
      </h2>

      <button
        id="copy"
        class="btn alt"
        type="button"
      >
        COPY ROOM LINK
      </button>

      <div id="share"></div>

      <div
        id="plist"
        class="players"
      ></div>

      <div class="row">

        <button
          id="start"
          class="btn"
          type="button"
        >
          START RACE
        </button>

        <button
          id="leave"
          class="btn alt"
          type="button"
        >
          LEAVE
        </button>

      </div>

    </div>
  </div>


  <!-- =====================================================
       HUD
       ===================================================== -->

  <div
    id="hud"
    class="hud hidden"
  >

    <div class="b pos">
      POSITION
      <div id="posv">
        1 / 1
      </div>
    </div>

    <div class="b lap">
      LAP
      <div id="lapv">
        LAP 1 / 3
      </div>
    </div>

    <div class="b time">
      TIME
      <div id="tv">
        0.0
      </div>
    </div>

    <div
      id="board"
      class="b board"
    ></div>

    <div
      id="count"
      class="count hidden"
    ></div>

    <div
      class="controls"
      style="
        position:absolute;
        right:14px;
        bottom:14px;
        text-align:right;
      "
    >
      WASD / ARROWS — RIDE<br>
      R — RESPAWN
    </div>

  </div>


  <!-- =====================================================
       TOUCH CONTROLS
       ===================================================== -->

  <div
    id="touch"
    class="touch"
  >

    <button
      data-k="left"
      type="button"
    >
      LEFT
    </button>

    <button
      data-k="gas"
      class="gas"
      type="button"
    >
      ACCELERATE
    </button>

    <button
      data-k="right"
      type="button"
    >
      RIGHT
    </button>

    <button
      data-k="brake"
      class="brake"
      type="button"
    >
      BRAKE
    </button>

    <button
      data-k="r"
      type="button"
    >
      RESPAWN
    </button>

  </div>


  <!-- =====================================================
       FINISH
       ===================================================== -->

  <div
    id="finish"
    class="finish hidden"
  >

    <div class="panel">

      <h1>
        🏆 FINISH!
      </h1>

      <div id="results"></div>

      <div class="row">

        <button
          id="rematch"
          class="btn"
          type="button"
        >
          REMATCH
        </button>

        <button
          id="back"
          class="btn alt"
          type="button"
        >
          RETURN TO LOBBY
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       DEPENDENCIES

       PeerJS MUST be loaded exactly once and BEFORE game.js.
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script type="module" src="./game.js"></script>

</body>
</html>
